# Nginx: fix "413 Request Entity Too Large" for database import (up to 1024MB)
#
# Apply ONE of these, then: sudo nginx -t && sudo systemctl reload nginx

# Option A — inside your site `server { ... }` block:
#   client_max_body_size 1100M;

# Option B — drop this file into /etc/nginx/conf.d/ and reload nginx:
client_max_body_size 1100M;
