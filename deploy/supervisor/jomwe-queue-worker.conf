; Laravel queue worker — /var/www/html/loans/jomwe
; Install: sudo cp deploy/supervisor/jomwe-queue-worker.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update

[program:jomwe-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/loans/jomwe/artisan queue:work database --sleep=3 --tries=3 --timeout=3600 --max-time=3600
directory=/var/www/html/loans/jomwe
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/loans/jomwe/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
