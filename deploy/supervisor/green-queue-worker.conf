; Laravel queue worker — processes all queued jobs (database driver).
; Install: sudo cp deploy/supervisor/green-queue-worker.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update

[program:green-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/green/artisan queue:work database --sleep=3 --tries=3 --timeout=3600 --max-time=3600
directory=/var/www/html/green
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/green/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
