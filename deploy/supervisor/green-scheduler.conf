; Laravel scheduler — runs CollectMatureInterest, RepaymentReminder, CheckSubscriptionExpiry, etc.
; Install: sudo cp deploy/supervisor/green-scheduler.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update

[program:green-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/green/artisan schedule:work
directory=/var/www/html/green
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/green/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
