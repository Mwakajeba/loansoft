; Laravel scheduler — /var/www/html/loans/jomwe
; Install: sudo cp deploy/supervisor/jomwe-scheduler.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update

[program:jomwe-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/loans/jomwe/artisan schedule:work
directory=/var/www/html/loans/jomwe
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/loans/jomwe/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
